name: privacy-and-syntax

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: privacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Privacy gate
        shell: pwsh
        run: ./tools/privacy_audit.ps1
      - name: Reachable Git history privacy gate
        shell: pwsh
        run: python tools/privacy_audit_history.py
      - name: Commit metadata privacy gate
        shell: pwsh
        run: python tools/privacy_audit_commit_metadata.py
      - name: Python syntax
        shell: pwsh
        run: python -m compileall -q code experiments scripts tools
      - name: Install lightweight test dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check numpy pillow safetensors pip-audit
      - name: Audit declared Python dependencies
        shell: pwsh
        run: python -m pip_audit -r requirements.txt
      - name: Unit tests
        shell: pwsh
        run: |
          python code/metric_eval/tests/test_metric_rules.py
          python code/one_to_one_eval/test_1v1_eval.py
          python code/evidence_pipeline/test_build_robust_evidence_mix.py
          python code/joint_report/test_joint_report.py
          python code/standard_eval/test_archive_interpretability.py
          python experiments/lora_freezing/test_audit_adapter_components.py
      - name: Release hash integrity
        shell: pwsh
        run: |
          ./tools/update_release_hashes.ps1
          git diff --exit-code -- RELEASE_SHA256.txt
