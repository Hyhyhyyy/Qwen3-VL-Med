model_name_or_path: /path/to/base/Qwen3-VL-4B-Instruct
template: qwen3_vl
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
use_rslora: false
use_dora: false

# R18 policy: same joint target as R16, but R17/R06-style LoRA.
freeze_vision_tower: false
freeze_multi_modal_projector: true
freeze_language_model: false

dataset_dir: /path/to/private/dataset_registry
dataset: joint_report_private
cutoff_len: 8192
image_max_pixels: 262144
image_min_pixels: 262144
preprocessing_num_workers: 4
preprocessing_batch_size: 8
output_dir: /path/to/private/output/joint_projector_frozen
logging_steps: 5
save_strategy: "no"
plot_loss: true
overwrite_output_dir: false
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true
flash_attn: sdpa
ddp_find_unused_parameters: false
report_to: none
seed: 42
