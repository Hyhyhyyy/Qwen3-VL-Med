model_name_or_path: /path/to/Qwen3-VL-4B-Instruct
template: qwen3_vl_nothink

stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false

dataset_dir: /path/to/private/dataset_registry
dataset: r03_02_evidence_to_diagnosis
cutoff_len: 4096
preprocessing_num_workers: 4
preprocessing_batch_size: 8

output_dir: ./outputs/full_evidence_to_diagnosis
logging_steps: 5
save_strategy: "no"
plot_loss: true
overwrite_output_dir: false
resume_from_checkpoint: null

per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true
flash_attn: sdpa
report_to: none
seed: 42

deepspeed: configs/ds_a100_z3_nooffload.json
