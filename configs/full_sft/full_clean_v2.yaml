model_name_or_path: /path/to/Qwen3-VL-4B-Instruct
template: qwen3_vl

stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: false
freeze_multi_modal_projector: false
freeze_language_model: false

dataset_dir: /path/to/private/dataset_registry
dataset: wsi_train_clean_v2
cutoff_len: 8192
image_max_pixels: 262144
image_min_pixels: 262144
preprocessing_num_workers: 4
preprocessing_batch_size: 8

output_dir: ./outputs/full_clean_v2
logging_steps: 5
save_steps: 400
save_total_limit: 2
plot_loss: true
overwrite_output_dir: false
resume_from_checkpoint: null

per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true
flash_attn: sdpa
ddp_find_unused_parameters: false
report_to: none

deepspeed: configs/ds_a100_z3_nooffload.json
